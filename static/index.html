<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticketera de Soporte</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Ticketera de Soporte</h1>

    <section id="users-section">
        <h2>Usuarios</h2>
        <div class="form-group">
            <label for="userName">Nombre</label>
            <input type="text" id="userName" name="name" required>
        </div>
        <div class="form-group">
            <label for="userEmail">Email</label>
            <input type="email" id="userEmail" name="email" required>
        </div>
        <div class="form-group">
            <label for="userRole">Rol</label>
            <select id="userRole" name="userRole">
                <option value="">Seleccionar</option>
                <option value="requester">Solicitante</option>
                <option value="technician">Técnico</option>
                <option value="coordinator">Coordinador</option>
            </select>
        </div>
        <button id="createUserBtn" class="btn-submit">Crear usuario</button>
    </div>
    <div class="form-group">
        <label for="actingAs">Actuando como</label>
        <select id="actingAs" name="actingAs"></select>
    </div>
</section>

    <section id="ticket-form">
        <h2>Nuevo ticket</h2>
        <form id="ticketForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="title">Título</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="description">Descripción</label>
                    <textarea id="description" name="description" required></textarea>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="category">Categoría</label>
                    <select id="category" name="category"></select>
</section>
                </div>
                <div class="form-group">
                    <label for="priority">Prioridad</label>
                    <select id="priority" name="priority"></select>
</section>
                </div>
            </div>
            <button type="submit" class="btn-submit">Crear ticket</button>
        </form>
    </section>

    <section id="tickets-list">
        <h2>Lista de tickets</h2>
        <div class="filters">
            <div class="form-group">
                <label for="statusFilter">Estado</label>
                <select id="statusFilter" name="status">
                    <option value="">Todos</option>
                    <option value="new">Nuevo</option>
                    <option value="in_progress">En proceso</option>
                    <option value="resolved">Resuelto</option>
                    <option value="closed">Cerrado</option>
                </select>
</section>
            </div>
            <div class="form-group">
                <label for="categoryFilter">Categoría</label>
                <select id="categoryFilter" name="category"></select>
</section>
            </div>
            <div class="form-group">
                <label for="priorityFilter">Prioridad</label>
                <select id="priorityFilter" name="priority"></select>
</section>
            </div>
            <div class="form-group">
                <label for="search">Búsqueda</label>
                <input type="text" id="search" name="search" placeholder="Buscar título o descripción">
            </div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Categoría</th>
                    <th>Prioridad</th>
                    <th>Asignado a</th>
                    <th>Estado</th>
                    <th>Creado</th>
                </tr>
            </thead>
            <tbody id="ticketsBody"></tbody>
        </table>
    </section>

    <div id="errorMessage" class="error"></div>

    <!-- Modal -->
    <div id="ticketModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="modal-close-btn">✕</span>
            <div class="modal-header">
                <h2 class="modal-title">Detalle del ticket</h2>
            </div>
            <div id="modalError" class="error"></div>
            <div class="modal-body"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
